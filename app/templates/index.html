<!DOCTYPE html>
<html>
<head>
    <title>Medical AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
        }

        input, button {
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #00c6ff;
            border: none;
            color: black;
            cursor: pointer;
        }

        img {
            width: 200px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
        }

        .risk {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>🧠 Medical AI Dashboard</h2>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit">Analyze</button>
        </form>

        {% if filename %}
            <img src="{{ url_for('static', filename=filename) }}">
        {% endif %}

        {% if result %}
            <div class="result">
                <p>Prediction: <b>{{ result }}</b></p>
                <p>Confidence: {{ confidence }}</p>

                {% if confidence > 0.8 %}
                    <p class="risk" style="color:red;">High Risk</p>
                {% elif confidence > 0.5 %}
                    <p class="risk" style="color:orange;">Medium Risk</p>
                {% else %}
                    <p class="risk" style="color:green;">Low Risk</p>
                {% endif %}
            </div>

            <canvas id="chart"></canvas>

            <script>
                const ctx = document.getElementById('chart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Confidence'],
                        datasets: [{
                            label: 'Prediction Strength',
                            data: [{{ confidence }}],
                        }]
                    }
                });
            </script>

        {% endif %}

    </div>
</div>

</body>
</html>
